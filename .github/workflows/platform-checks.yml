name: Platform checks
on:
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-checks.yml']
  push:
    branches: ['codex/secure-platform-v2']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm audit --prefix functions --omit=dev
